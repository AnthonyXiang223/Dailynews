services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dailynews-db
    environment:
      POSTGRES_USER: dailynews
      POSTGRES_PASSWORD: dailynews
      POSTGRES_DB: dailynews
    ports:
      - "5433:5432"  # 宿主机 5432 被 WSL 的 PostgreSQL 占用,项目用 5433
    volumes:
      - dailynews_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dailynews -d dailynews"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dailynews_pgdata:
